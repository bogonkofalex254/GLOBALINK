<style>
:root{
  --bg:#f6f7f1; --card:#fff; --ink:#09f172; --mute:hsl(253, 93%, 44%); --line:#dde3d8;
  --green:hsl(148, 91%, 50%); --green-d:#0af176; --chalk:hsl(9, 91%, 49%); --soft:hsl(125, 89%, 49%); --err:#b3261e;
  --h:'Bricolage Grotesque','Trebuchet MS',sans-serif; --b:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#040313;--card:lch(11.49% 16.23 69.21);--ink:#f3eeea;--mute:hwb(9 96% 1%);--line:#274034;--green:#35c26f;--green-d:hsl(0, 95%, 48%);--soft:#1b3326;--err:#ff8a80}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--b)}
h1,h2,h3{font-family:var(--h);line-height:1.1;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.hero{background:#10301f;color:#f3f7ef;padding:44px 0 56px;border-bottom:6px solid var(--chalk)}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;max-width:14em}
.hero p{max-width:34em;color:hsl(132, 91%, 48%);margin:16px 0 22px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:600 16px var(--b);border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--green);color:#fff}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.chalk{background:var(--chalk);color:#2b2200}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:32px 0 20px;flex-wrap:wrap}
.tab{font:600 16px var(--b);padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvl-info{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:40px}
.sub{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.sub h3{font-size:21px}
.sub .teacher{color:var(--mute);font-size:15px;margin:0}
.sub .when{font-weight:600;font-size:15px}
.sub .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.sub .acts .btn{flex:1;padding:10px 12px;font-size:15px;white-space:nowrap}
.badge{display:inline-block;background:var(--soft);color:var(--green);border-radius:6px;padding:2px 8px;font-size:14px;font-weight:600;align-self:flex-start}
.price{font-size:14px;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,20,13,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.modal{background:var(--card);color:var(--ink);border-radius:16px;max-width:440px;width:100%;padding:24px;max-height:92vh;overflow:auto}
.modal h2{font-size:26px;margin-bottom:6px}
.modal .sum{background:var(--soft);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;font:17px var(--b);padding:11px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.err{color:var(--err);font-size:15px;min-height:1.2em;margin:6px 0 0}
.x{float:right;background:none;border:0;font-size:26px;color:var(--mute);cursor:pointer;line-height:1}
.code{font:800 34px var(--h);letter-spacing:.08em;text-align:center;background:#10301f;color:var(--chalk);border-radius:12px;padding:16px;margin:14px 0;user-select:all}
.spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;margin:18px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.center{text-align:center}
.links{display:grid;gap:10px;margin-top:12px}
.links a{display:block;text-align:center;text-decoration:none}
.small{font-size:14px;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--mute);font-size:15px}
.demo{background:var(--chalk);color:#2b2200;font-size:14px;text-align:center;padding:6px 10px;font-weight:600}
</style>

<main class="wrap" id="classes">

<footer><div class="wrap"> Call or WhatsApp <strong id="helpNo"></strong>. Keep your access code private; it works for one learner.</div></footer>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="modal" id="modal"></div></div>

<script>
/* ============================ CONFIG ============================
   1. Replace every meetLive / recordings link with your real Google Meet
      and recording links (Google Drive / YouTube unlisted).
   2. Set DEMO_MODE=false and point STK_ENDPOINT / VERIFY_ENDPOINT at your
      own server (see the notes inside requestStkPush and verifyCode).
=================================================================== */
const CONFIG = {
  DEMO_MODE: true,
  BUSINESS_NAME: "Darasa Online",
  HELP_PHONE: "+254 726 393 728",
  ACCESS_DAYS: 30,                       // how long a code stays valid
  STK_ENDPOINT: "/api/mpesa/stkpush",    // your server -> Safaricom Daraja
  VERIFY_ENDPOINT: "/api/code/verify"    // your server checks the code
};

const LEVELS = {
  junior: {
    name: "Junior School", info: "Grades 7 to 9",
    price: { live: 100, recorded: 50, both: 130 },
    subjects: [
      { id:"j-math", name:"Mathematics", teacher:"Mr. Otieno", time:"Mon & Wed, 4:00 PM",
        meetLive:"https://meet.google.com/aaa-bbbb-ccc", recordings:"https://drive.google.com/drive/folders/REPLACE-JUNIOR-MATH" },
      { id:"j-eng", name:"English", teacher:"Ms. Wanjiru", time:"Tue & Thu, 4:00 PM",
        meetLive:"https://meet.google.com/aaa-bbbb-ccd", recordings:"https://drive.google.com/drive/folders/REPLACE-JUNIOR-ENG" },
      { id:"j-kis", name:"Kiswahili", teacher:"Bw. Mwangi", time:"Mon & Thu, 5:00 PM",
        meetLive:"https://meet.google.com/aaa-bbbb-cce", recordings:"https://drive.google.com/drive/folders/REPLACE-JUNIOR-KIS" },
      { id:"j-sci", name:"Integrated Science", teacher:"Mrs. Achieng", time:"Wed & Fri, 4:00 PM",
        meetLive:"https://meet.google.com/aaa-bbbb-ccf", recordings:"https://drive.google.com/drive/folders/REPLACE-JUNIOR-SCI" },
      { id:"j-soc", name:"Social Studies", teacher:"Mr. Kamau", time:"Tue, 5:00 PM",
        meetLive:"https://meet.google.com/aaa-bbbb-ccg", recordings:"https://drive.google.com/drive/folders/REPLACE-JUNIOR-SOC" },
      { id:"j-agr", name:"Agriculture & Nutrition", teacher:"Ms. Chebet", time:"Fri, 5:00 PM",
        meetLive:"https://meet.google.com/aaa-bbbb-cch", recordings:"https://drive.google.com/drive/folders/REPLACE-JUNIOR-AGR" }
        
    ]
  },
  senior: {
    name: "Senior School", info: "Grades 10 to 12 (Arts and Social Sciences, and core subjects)",
    price: { live: 150, recorded: 80, both: 200 },
    subjects: [
      { id:"s-math", name:"Mathematics", teacher:"Mr. Njoroge", time:"Mon & Wed, 6:00 PM",
        meetLive:"https://meet.google.com/bbb-cccc-ddd", recordings:"https://drive.google.com/drive/folders/REPLACE-SENIOR-MATH" },
      { id:"s-eng", name:"English", teacher:"Ms. Akinyi", time:"Tue & Thu, 6:00 PM",
        meetLive:"https://meet.google.com/bbb-cccc-dde", recordings:"https://drive.google.com/drive/folders/REPLACE-SENIOR-ENG" },
      { id:"s-bus", name:"Business Studies", teacher:"Mr. Mutua", time:"Mon & Fri, 5:00 PM",
        meetLive:"https://meet.google.com/bbb-cccc-ddf", recordings:"https://drive.google.com/drive/folders/REPLACE-SENIOR-BUS" },
      { id:"s-his", name:"History & Citizenship", teacher:"Mrs. Wambui", time:"Wed, 5:00 PM",
        meetLive:"https://meet.google.com/bbb-cccc-ddg", recordings:"https://drive.google.com/drive/folders/REPLACE-SENIOR-HIS" },
      { id:"s-geo", name:"Geography", teacher:"Mr. Omondi", time:"Thu, 5:00 PM",
        meetLive:"https://meet.google.com/bbb-cccc-ddh", recordings:"https://drive.google.com/drive/folders/REPLACE-SENIOR-GEO" },
      { id:"s-kis", name:"Kiswahili", teacher:"Bi. Fatuma", time:"Tue, 5:00 PM",
        meetLive:"https://meet.google.com/bbb-cccc-ddi", recordings:"https://drive.google.com/drive/folders/REPLACE-SENIOR-KIS" }
    ]
  },
  stem: {
    name: " STEM", info: "Grades 10 to 12, Science, Technology, Engineering and Mathematics pathway",
    price: { live: 200, recorded: 100, both: 260 },
    subjects: [
      { id:"t-math", name:"Advanced Mathematics", teacher:"Dr. Kiprono", time:"Mon & Wed, 7:00 PM",
        meetLive:"https://meet.google.com/ccc-dddd-eee", recordings:"https://drive.google.com/drive/folders/REPLACE-STEM-MATH" },
      { id:"t-phy", name:"Physics", teacher:"Mr. Barasa", time:"Tue & Thu, 7:00 PM",
        meetLive:"https://meet.google.com/ccc-dddd-eef", recordings:"https://drive.google.com/drive/folders/REPLACE-STEM-PHY" },
      { id:"t-chem", name:"Chemistry", teacher:"Mrs. Nduta", time:"Mon & Fri, 6:00 PM",
        meetLive:"https://meet.google.com/ccc-dddd-eeg", recordings:"https://drive.google.com/drive/folders/REPLACE-STEM-CHEM" },
      { id:"t-bio", name:"Biology", teacher:"Ms. Jepkemei", time:"Wed, 6:00 PM",
        meetLive:"https://meet.google.com/ccc-dddd-eeh", recordings:"https://drive.google.com/drive/folders/REPLACE-STEM-BIO" },
      { id:"t-cs", name:"Computer Science", teacher:"Mr. Ouma", time:"Thu, 6:00 PM",
        meetLive:"https://meet.google.com/ccc-dddd-eei", recordings:"https://drive.google.com/drive/folders/REPLACE-STEM-CS" },
      { id:"t-eng", name:"Engineering & Technology", teacher:"Eng. Mbugua", time:"Sat, 10:00 AM",
        meetLive:"https://meet.google.com/ccc-dddd-eej", recordings:"https://drive.google.com/drive/folders/REPLACE-STEM-ENG" }
    ]
  }
};

const TYPES = { live:"Live classes", recorded:"Recorded classes", both:"Live + recorded" };
const KEY = "darasa_codes_v1";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentLevel = "junior";

/* ---------- storage (demo only: a real site keeps codes on a server) ---------- */
function loadCodes(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function saveCodes(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
let memoryCodes = {};            // fallback if storage is blocked
function getCodes(){ const s = loadCodes(); return Object.keys(s).length ? s : memoryCodes; }
function putCode(rec){ const all = getCodes(); all[rec.code] = rec; memoryCodes = all; saveCodes(all); }

function findSubject(id){
  for(const lv of Object.keys(LEVELS)){
    const s = LEVELS[lv].subjects.find(x => x.id === id);
    if(s) return {level:lv, subject:s};
  }
}
function makeCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const pick = n => Array.from({length:n}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
  return "DO-" + pick(4) + "-" + pick(4);
}
function fakeReceipt(){ return "S" + Array.from({length:9},()=> "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789"[Math.floor(Math.random()*34)]).join(""); }
function normalizePhone(p){
  p = String(p).replace(/[\s\-+]/g,"");
  if(/^0[17]\d{8}$/.test(p)) return "254" + p.slice(1);
  if(/^254[17]\d{8}$/.test(p)) return p;
  if(/^[17]\d{8}$/.test(p)) return "254" + p;
  return null;
}
const fmtDate = t => new Date(t).toLocaleDateString("en-KE",{day:"numeric",month:"short",year:"numeric"});

/* ---------- page render ---------- */
function renderTabs(){
  $("tabs").innerHTML = Object.keys(LEVELS).map(k =>
    `<button class="tab" role="tab" aria-selected="${k===currentLevel}" data-lv="${k}">${esc(LEVELS[k].name)}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { currentLevel = b.dataset.lv; renderTabs(); renderGrid(); });
}
function renderGrid(){
  const L = LEVELS[currentLevel];
  $("lvlInfo").textContent = L.info + ". Live KES " + L.price.live + ", recorded KES " + L.price.recorded + ", both KES " + L.price.both + " per subject for " + CONFIG.ACCESS_DAYS + " days.";
  $("grid").innerHTML = L.subjects.map(s => `
    <article class="sub">
      <h3>${esc(s.name)}</h3>
      <p class="teacher">${esc(s.teacher)}</p>
      <span class="badge">${esc(s.time)}</span>
      <div class="acts"><button class="btn" data-id="${s.id}">Pay and join</button></div>
    </article>`).join("");
  $("grid").querySelectorAll("button[data-id]").forEach(b => b.onclick = () => openPay(b.dataset.id));
}

/* ---------- modal helpers ---------- */
function openModal(html){ $("modal").innerHTML = html; $("ov").classList.add("on"); const f = $("modal").querySelector("input,select,button"); if(f) f.focus(); }
function closeModal(){ $("ov").classList.remove("on"); }
$("ov").addEventListener("click", e => { if(e.target === $("ov")) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
document.addEventListener("click", e => { if(e.target.classList.contains("x")) closeModal(); });

/* ---------- pay flow ---------- */
function openPay(id){
  const {level, subject} = findSubject(id);
  const L = LEVELS[level];
  openModal(`
    <button class="x" aria-label="Close">&times;</button>
    <h2 id="mTitle">Pay with M-Pesa</h2>
    <div class="sum"><strong>${esc(subject.name)}</strong> &middot; ${esc(L.name)}<br><span class="small">${esc(subject.teacher)}, ${esc(subject.time)}</span></div>
    <label for="fName">Learner's name</label>
    <input id="fName" autocomplete="name" placeholder="e.g. Amina Wekesa">
    <label for="fPhone">M-Pesa phone number</label>
    <input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XX XXX XXX">
    <label for="fType">What do you want to access?</label>
    <select id="fType">
      ${Object.keys(TYPES).map(t => `<option value="${t}">${TYPES[t]} (KES ${L.price[t]})</option>`).join("")}
    </select>
    <p class="err" id="fErr" role="alert"></p>
    <button class="btn" id="payBtn" style="width:100%;margin-top:6px">Send M-Pesa prompt</button>
    <p class="small">You will get a prompt on your phone. Enter your M-Pesa PIN to confirm.</p>`);
  $("payBtn").onclick = () => startPayment(id, level);
}

async function startPayment(id, level){
  const name = $("fName").value.trim();
  const phone = normalizePhone($("fPhone").value);
  const type = $("fType").value;
  if(name.length < 2){ $("fErr").textContent = "Enter the learner's name."; return; }
  if(!phone){ $("fErr").textContent = "Enter a valid Safaricom number, like 0712345678."; return; }
  const amount = LEVELS[level].price[type];
  const sub = findSubject(id).subject;
  openModal(`<div class="center"><h2 id="mTitle">Check your phone</h2><div class="spin" aria-hidden="true"></div>
    <p>We sent an M-Pesa prompt for <strong>KES ${amount}</strong> to <strong>+${phone}</strong>.<br>Enter your PIN to pay. This takes about 30 seconds.</p></div>`);
  try{
    const res = await requestStkPush({ phone, amount, reference: sub.id, name });
    const rec = { code: res.code || makeCode(), receipt: res.receipt, subjectId: id, level, type, name, phone,
                  amount, paidAt: Date.now(), expires: Date.now() + CONFIG.ACCESS_DAYS*864e5 };
    putCode(rec);
    showAccess(rec, true);
  }catch(err){
    openModal(`<button class="x" aria-label="Close">&times;</button><h2 id="mTitle">Payment not completed</h2>
      <p>${esc(err.message || "The payment did not go through.")} You were not charged unless you received an M-Pesa confirmation message.</p>
      <button class="btn" id="retry" style="width:100%">Try again</button>`);
    $("retry").onclick = () => openPay(id);
  }
}

/* Talks to Safaricom Daraja through YOUR server.
   Real setup: your server calls the Daraja STK Push API (Lipa Na M-Pesa Online),
   waits for the callback, then returns { code, receipt } only when ResultCode is 0.
   Never put your Daraja consumer key/secret in this page. */
async function requestStkPush(payload){
  if(CONFIG.DEMO_MODE){
    await new Promise(r => setTimeout(r, 3500));
    return { receipt: fakeReceipt() };           // code is generated by makeCode()
  }
  const r = await fetch(CONFIG.STK_ENDPOINT, {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)
  });
  const data = await r.json();
  if(!r.ok || !data.paid) throw new Error(data.message || "Payment was cancelled or timed out.");
  return data;
}

/* Real setup: POST the code to your server, which returns the record
   { subjectId, level, type, expires } if the code is valid and not expired. */
async function verifyCode(code){
  if(CONFIG.DEMO_MODE) return getCodes()[code] || null;
  const r = await fetch(CONFIG.VERIFY_ENDPOINT, {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({code})
  });
  if(!r.ok) return null;
  return await r.json();
}

/* ---------- access screen ---------- */
function showAccess(rec, justPaid){
  const f = findSubject(rec.subjectId); if(!f){ return; }
  const s = f.subject, L = LEVELS[rec.level];
  const live = rec.type !== "recorded", rec_ = rec.type !== "live";
  openModal(`
    <button class="x" aria-label="Close">&times;</button>
    <h2 id="mTitle">${justPaid ? "Payment received" : "Access unlocked"}</h2>
    <p>${justPaid ? "Your access code for " : "Showing "}<strong>${esc(s.name)}</strong> (${esc(L.name)}).</p>
    ${justPaid ? `<div class="code" aria-label="Access code">${esc(rec.code)}</div>
      <p class="small">Save this code. Use "I already have a code" any time to open your links. M-Pesa receipt: ${esc(rec.receipt || "n/a")}.</p>` : ""}
    <div class="links">
      ${live ? `<a class="btn" href="${esc(s.meetLive)}" target="_blank" rel="noopener">Join live class on Google Meet</a>` : ""}
      ${rec_ ? `<a class="btn chalk" href="${esc(s.recordings)}" target="_blank" rel="noopener">Watch recorded classes</a>` : ""}
    </div>
    <p class="small">${esc(TYPES[rec.type])} for ${esc(rec.name)}. Valid until ${fmtDate(rec.expires)}. Live class time: ${esc(s.time)}.</p>`);
}

/* ---------- enter code ---------- */
function openCodeEntry(){
  openModal(`
    <button class="x" aria-label="Close">&times;</button>
    <h2 id="mTitle">Enter your access code</h2>
    <p class="small">The code you received after paying, like DO-ABCD-2345.</p>
    <label for="cIn">Access code</label>
    <input id="cIn" autocapitalize="characters" autocomplete="off" placeholder="DO-XXXX-XXXX">
    <p class="err" id="cErr" role="alert"></p>
    <button class="btn" id="cGo" style="width:100%;margin-top:6px">Open my class links</button>`);
  const go = async () => {
    const code = $("cIn").value.trim().toUpperCase();
    if(!code){ $("cErr").textContent = "Type your code first."; return; }
    $("cGo").disabled = true;
    let rec = null;
    try{ rec = await verifyCode(code); }catch(e){}
    $("cGo").disabled = false;
    if(!rec){ $("cErr").textContent = "That code was not found. Check it and try again."; return; }
    if(rec.expires < Date.now()){ $("cErr").textContent = "This code expired on " + fmtDate(rec.expires) + ". Pay again to renew."; return; }
    showAccess(rec, false);
  };
  $("cGo").onclick = go;
  $("cIn").addEventListener("keydown", e => { if(e.key === "Enter") go(); });
}

/* ---------- start ---------- */
$("haveCode").onclick = openCodeEntry;
$("helpNo").textContent = CONFIG.HELP_PHONE;
$("demoBar").style.display = CONFIG.DEMO_MODE ? "block" : "none";
document.title = CONFIG.BUSINESS_NAME + " – Pay with M-Pesa, join your class";
renderTabs(); renderGrid();
</script>
